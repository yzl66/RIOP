[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "riop-planner"
version = "0.1.0"
description = "Risk-aware iterative refinement for YOPO quadrotor trajectories"
requires-python = ">=3.8"
dependencies = ["torch>=2.0", "numpy>=1.22", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["riop*"]

